# Add inside the test.saaristolautat.fi HTTPS server block. The trailing slash
# on proxy_pass strips /reititysdemo/ before forwarding the request to FastAPI.
location = /reititysdemo {
    return 301 /reititysdemo/;
}

location /reititysdemo/ {
    proxy_pass http://routing-demo:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /reititysdemo;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
